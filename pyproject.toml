[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineer-journey"
version = "0.1.0"
description = "Hands-on utilities developed during an Associate AI Engineer learning journey."
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]